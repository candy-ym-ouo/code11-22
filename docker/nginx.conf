# 家中物品来历册 · 边缘代理
# 职责：
#   1. 直接托管前端构建产物（/usr/share/nginx/html，镜像内自带，版本与后端同步发布）
#   2. 仅把 /api/、/healthz、/readyz 反代到 API 容器
# 用变量 + Docker 内嵌 DNS 做上游解析：API 容器重建后 IP 变化无需重启 nginx。

server {
    listen 80;
    server_name _;

    # 最大请求体必须 ≥ API 的 MAX_AUDIO_MB（默认 200MB），留 10MB 给 multipart 边界
    client_max_body_size 210m;
    client_body_timeout 120s;

    # 安全响应头（API 的 helmet 只管 API 响应；HTML/静态文件在这里补）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- 反向代理：API 与健康检查（变量形式，启动时不强制解析上游） ----
    location = /healthz {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream_api "api:4000";
        proxy_pass http://$upstream_api;
        include /etc/nginx/proxy_params;
    }

    location = /readyz {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream_api "api:4000";
        proxy_pass http://$upstream_api;
        include /etc/nginx/proxy_params;
    }

    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream_api "api:4000";
        proxy_pass http://$upstream_api;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # 音频拖动 / 大文件下载依赖流式响应与长连接
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ---- 静态托管：带 hash 的资源长缓存，其余不缓存 ----
    location /assets/ {
        root /usr/share/nginx/html;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /favicon.ico {
        root /usr/share/nginx/html;
        access_log off;
        log_not_found off;
        try_files $uri =204;
    }

    # SPA fallback：任何非 API 路径都回 index.html（前端路由自行处理 404）
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
